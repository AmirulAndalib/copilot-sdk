models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: What is 2+2?
      - role: assistant
        content: 2 + 2 = 4
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: What is 2+2?
      - role: assistant
        content: 2 + 2 = 4
      - role: user
        content: Call magic_number with seed 'hello' and client_echo with text 'ping', then report both results
      - role: assistant
        tool_calls:
          - id: toolcall_0
            type: function
            function:
              name: magic_number
              arguments: '{"seed":"hello"}'
          - id: toolcall_1
            type: function
            function:
              name: client_echo
              arguments: '{"text":"ping"}'
      - role: tool
        tool_call_id: toolcall_0
        content: MAGIC_hello_42
      - role: tool
        tool_call_id: toolcall_1
        content: CLIENT_ECHO_ping
      - role: assistant
        content: "Both tools ran: MAGIC_hello_42 and CLIENT_ECHO_ping"
